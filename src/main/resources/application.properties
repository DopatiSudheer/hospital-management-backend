# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/hospital}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}

# Default admin account configuration
app.admin.email=${ADMIN_EMAIL:admin@hospital.com}
app.admin.password=${ADMIN_PASSWORD:admin@123}
app.admin.name=${ADMIN_NAME:System Administrator}

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql